service: tinkiva-messaging-gateway
frameworkVersion: "4"

stages:
  default:
    params:
      publicBaseUrl: https://messaging-api.tinkiva.com
  dev:
    params:
      publicBaseUrl: https://2myga1gnfl.execute-api.us-east-1.amazonaws.com

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  versionFunctions: false
  deploymentMethod: direct
  httpApi:
    cors: false
    authorizers:
      applicationAuthorizer:
        type: request
        functionName: apiAuthorizer
        identitySource:
          - $request.header.Authorization
        payloadVersion: "2.0"
        enableSimpleResponses: true
        resultTtlInSeconds: 0
  websocketsApiName: tinkiva-messaging-realtime-${sls:stage}
  websocketsApiRouteSelectionExpression: $request.body.action
  logs:
    websocket:
      level: ERROR
      fullExecutionData: false
  environment:
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
    STAGE: ${sls:stage}
  stackTags:
    Project: tinkiva-messaging
    Service: messaging-gateway
    Stage: ${sls:stage}
    ManagedBy: serverless-framework
  tags:
    Project: tinkiva-messaging
    Service: messaging-gateway
    Stage: ${sls:stage}
    ManagedBy: serverless-framework

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap:
      type: linked
      setNodeOptions: true
    target: node22

package:
  individually: true
  patterns:
    - "!coverage/**"
    - "!dist/**"
    - "!docs/**"
    - "!infrastructure/**"
    - "!scripts/**"
    - "!tests/**"

functions:
  health:
    handler: src/functions/health/handler.main
    description: Liveness endpoint without internal infrastructure details.
    timeout: 5
    role:
      Fn::GetAtt:
        - HealthLambdaRole
        - Arn
    events:
      - httpApi:
          path: /health
          method: GET

  authToken:
    handler: src/functions/auth-token/handler.main
    description: Issues short-lived application access tokens.
    timeout: 10
    role:
      Fn::GetAtt:
        - AuthTokenLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      AUTH_PEPPER_SECRET_ARN:
        Ref: AuthPepperSecret
      JWT_SIGNING_SECRET_ARN:
        Ref: JwtSigningSecret
      TOKEN_AUDIENCE: tinkiva-messaging-gateway
      TOKEN_ISSUER: https://messaging-api.tinkiva.com
      TOKEN_TTL_SECONDS: "900"
    events:
      - httpApi:
          path: /v1/auth/token
          method: POST

  apiAuthorizer:
    handler: src/functions/api-authorizer/handler.main
    description: Validates application JWTs and current client authorization.
    timeout: 10
    role:
      Fn::GetAtt:
        - ApiAuthorizerLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      AUTH_PEPPER_SECRET_ARN:
        Ref: AuthPepperSecret
      JWT_SIGNING_SECRET_ARN:
        Ref: JwtSigningSecret
      TOKEN_AUDIENCE: tinkiva-messaging-gateway
      TOKEN_ISSUER: https://messaging-api.tinkiva.com
      TOKEN_TTL_SECONDS: "900"

  privateApi:
    handler: src/functions/private-api/handler.main
    description: Application-scoped tenant, integration, and messaging API.
    timeout: 29
    role:
      Fn::GetAtt:
        - PrivateApiLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_URL_TTL_SECONDS: "300"
      REALTIME_TICKET_TTL_SECONDS: "60"
      REALTIME_WEBSOCKET_URL:
        Fn::Join:
          - ""
          - - "wss://"
            - Ref: WebsocketsApi
            - ".execute-api."
            - Ref: AWS::Region
            - ".amazonaws.com/${sls:stage}"
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      TELEGRAM_OUTBOUND_QUEUE_URL:
        Ref: TelegramOutboundQueue
      TELEGRAM_WEBHOOK_BASE_URL: ${param:publicBaseUrl, 'https://messaging-api.tinkiva.com'}
      TINKIVA_INTEGRATIONS_TABLE:
        Ref: TinkivaTenantIntegrations
      WHATSAPP_GRAPH_API_VERSION: ${param:whatsappGraphApiVersion, 'v25.0'}
      WHATSAPP_OUTBOUND_QUEUE_URL:
        Ref: WhatsappOutboundQueue
      WHATSAPP_WEBHOOK_BASE_URL: ${param:publicBaseUrl, 'https://messaging-api.tinkiva.com'}
    events:
      - httpApi:
          path: /v1/tenants
          method: POST
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/by-external-account/{externalAccountId}
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/telegram
          method: POST
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/whatsapp
          method: POST
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/{integrationId}/inbound-media
          method: PATCH
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/whatsapp/embedded-signup/config
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/whatsapp/embedded-signup
          method: POST
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/integrations/whatsapp/{integrationId}/credentials
          method: PUT
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/conversations
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/conversations/{conversationId}/messages
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/conversations/{conversationId}
          method: DELETE
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/tenants/{tenantId}/realtime/tickets
          method: POST
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/messages
          method: POST
          authorizer:
            name: applicationAuthorizer

  platformAdmin:
    handler: src/functions/platform-admin/handler.main
    description: Secure HTML console and API for platform-wide integration administration.
    timeout: 29
    role:
      Fn::GetAtt:
        - PlatformAdminLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      TINKIVA_INTEGRATIONS_TABLE:
        Ref: TinkivaTenantIntegrations
      STAGE: ${sls:stage}
    events:
      - httpApi:
          path: /admin
          method: GET
      - httpApi:
          path: /v1/platform/integrations
          method: GET
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/platform/integrations/{integrationId}/inbound-media
          method: PATCH
          authorizer:
            name: applicationAuthorizer
      - httpApi:
          path: /v1/platform/integrations/{integrationId}/deletions
          method: POST
          authorizer:
            name: applicationAuthorizer

  telegramWebhook:
    handler: src/functions/telegram-webhook/handler.main
    description: Verifies Telegram webhook credentials and enqueues provider updates.
    timeout: 8
    role:
      Fn::GetAtt:
        - TelegramWebhookLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      INBOUND_QUEUE_URL:
        Ref: InboundQueue
    events:
      - httpApi:
          path: /webhooks/telegram/{webhookKey}
          method: POST

  whatsappWebhook:
    handler: src/functions/whatsapp-webhook/handler.main
    description: Verifies Meta signatures and enqueues WhatsApp webhook events.
    timeout: 8
    role:
      Fn::GetAtt:
        - WhatsappWebhookLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      INBOUND_QUEUE_URL:
        Ref: InboundQueue
    events:
      - httpApi:
          path: /webhooks/whatsapp/{webhookKey}
          method: GET
      - httpApi:
          path: /webhooks/whatsapp/{webhookKey}
          method: POST

  inboundProcessor:
    handler: src/functions/inbound-processor/handler.main
    description: Normalizes and persists inbound provider messages with idempotency.
    timeout: 30
    role:
      Fn::GetAtt:
        - InboundProcessorLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_ENRICHMENT_QUEUE_URL:
        Ref: MediaQueue
      MEDIA_URL_TTL_SECONDS: "300"
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      STAGE: ${sls:stage}
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - InboundQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  mediaEnrichmentWorker:
    handler: src/functions/media-enrichment-worker/handler.main
    description: Generates OpenAI alternative text for inbound images and audio.
    timeout: 120
    memorySize: 1024
    package:
      patterns:
        - "node_modules/@ffmpeg-installer/linux-arm64/ffmpeg"
    role:
      Fn::GetAtt:
        - MediaEnrichmentWorkerLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_URL_TTL_SECONDS: "300"
      OPENAI_AUDIO_MODEL: ${param:openAiAudioModel, 'gpt-4o-mini-transcribe'}
      OPENAI_IMAGE_MODEL: ${param:openAiImageModel, 'gpt-5.6-luna'}
      STORAGIA_APPLICATION_ID: ${env:STORAGIA_AUTOMATION_APPLICATION_ID}
      TINKIVA_INTEGRATIONS_TABLE:
        Ref: TinkivaTenantIntegrations
      TINKIVA_KMS_KEY_ID:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
      STAGE: ${sls:stage}
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - MediaQueue
              - Arn
          batchSize: 2
          functionResponseType: ReportBatchItemFailures

  appEventProjector:
    handler: src/functions/app-event-projector/handler.main
    description:
      Projects durable message inserts and status changes into normalized application events.
    timeout: 30
    role:
      Fn::GetAtt:
        - AppEventProjectorLambdaRole
        - Arn
    environment:
      APP_EVENTS_QUEUE_URL:
        Ref: AppEventsQueue
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_URL_TTL_SECONDS: "300"
      STORAGIA_AUTOMATION_APPLICATION_ID: ${env:STORAGIA_AUTOMATION_APPLICATION_ID}
      STORAGIA_AUTOMATION_QUEUE_URL:
        Ref: StoragiaAutomationQueue
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - MessagingDataTable
              - StreamArn
          batchSize: 100
          startingPosition: LATEST
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - MESSAGE

  realtimeConnection:
    handler: src/functions/realtime-connection/handler.main
    description: Consumes one-time tickets and manages tenant-scoped WebSocket connections.
    timeout: 10
    role:
      Fn::GetAtt:
        - RealtimeConnectionLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: ping
          routeResponseSelectionExpression: $default
      - websocket:
          route: $default
          routeResponseSelectionExpression: $default

  realtimeDispatcher:
    handler: src/functions/realtime-dispatcher/handler.main
    description: Delivers normalized application events to active tenant WebSocket connections.
    timeout: 30
    role:
      Fn::GetAtt:
        - RealtimeDispatcherLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      WEBSOCKET_MANAGEMENT_ENDPOINT:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: WebsocketsApi
            - ".execute-api."
            - Ref: AWS::Region
            - ".amazonaws.com/${sls:stage}"
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - AppEventsQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  telegramSender:
    handler: src/functions/telegram-sender/handler.main
    description: Sends queued Telegram text messages and persists provider status.
    timeout: 30
    role:
      Fn::GetAtt:
        - TelegramSenderLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_URL_TTL_SECONDS: "300"
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - TelegramOutboundQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  whatsappSender:
    handler: src/functions/whatsapp-sender/handler.main
    description: Sends queued WhatsApp messages and persists provider status.
    timeout: 30
    role:
      Fn::GetAtt:
        - WhatsappSenderLambdaRole
        - Arn
    environment:
      CONTROL_TABLE:
        Ref: MessagingControlTable
      DATA_TABLE:
        Ref: MessagingDataTable
      MEDIA_BUCKET:
        Ref: MessagingMediaBucket
      MEDIA_URL_TTL_SECONDS: "900"
      PROVIDER_CREDENTIALS_KEY_ARN:
        Fn::GetAtt:
          - ProviderCredentialsKey
          - Arn
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - WhatsappOutboundQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  - ${file(./infrastructure/serverless/conditions.yml)}
  - ${file(./infrastructure/serverless/iam.yml)}
  - ${file(./infrastructure/serverless/phase2-iam.yml)}
  - ${file(./infrastructure/serverless/phase3-iam.yml)}
  - ${file(./infrastructure/serverless/phase4-iam.yml)}
  - ${file(./infrastructure/serverless/platform-admin-iam.yml)}
  - ${file(./infrastructure/serverless/media-enrichment-iam.yml)}
  - ${file(./infrastructure/serverless/realtime-iam.yml)}
  - ${file(./infrastructure/serverless/dynamodb.yml)}
  - ${file(./infrastructure/serverless/provider-credentials-kms.yml)}
  - ${file(./infrastructure/serverless/queues.yml)}
  - ${file(./infrastructure/serverless/storage.yml)}
  - ${file(./infrastructure/serverless/secrets.yml)}
  - ${file(./infrastructure/serverless/monitoring.yml)}
  - ${file(./infrastructure/serverless/subscriptions.yml)}
  - ${file(./infrastructure/serverless/outputs.yml)}
