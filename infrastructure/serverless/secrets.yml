Resources:
  AuthPepperSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /tinkiva/messaging/${sls:stage}/auth/pepper
      Description: Pepper used to derive application client secret digests.
      GenerateSecretString:
        SecretStringTemplate: '{"purpose":"application-client-digest"}'
        GenerateStringKey: value
        ExcludePunctuation: true
        PasswordLength: 64
      Tags:
        - Key: DataClassification
          Value: secret

  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /tinkiva/messaging/${sls:stage}/auth/jwt-signing
      Description: Symmetric signing key for short-lived application access tokens.
      GenerateSecretString:
        SecretStringTemplate: '{"algorithm":"HS256"}'
        GenerateStringKey: value
        ExcludePunctuation: true
        PasswordLength: 64
      Tags:
        - Key: DataClassification
          Value: secret
