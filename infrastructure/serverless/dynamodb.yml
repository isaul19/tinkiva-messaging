Resources:
  MessagingControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: messaging-control-${sls:stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled:
        Fn::If:
          - IsProduction
          - true
          - false
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled:
          Fn::If:
            - IsProduction
            - true
            - false
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: DataClassification
          Value: confidential

  MessagingDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: messaging-data-${sls:stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled:
        Fn::If:
          - IsProduction
          - true
          - false
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled:
          Fn::If:
            - IsProduction
            - true
            - false
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: DataClassification
          Value: confidential
