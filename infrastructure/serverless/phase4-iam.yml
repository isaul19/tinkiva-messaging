Resources:
  WhatsappWebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-whatsapp-webhook-${sls:stage}
      Description:
        Resolves WhatsApp webhook registrations, verifies Meta signatures, and enqueues updates.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: receive-whatsapp-webhooks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - MessagingControlTable
                    - Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - InboundQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-whatsappWebhook:*

  WhatsappSenderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-whatsapp-sender-${sls:stage}
      Description: Sends queued WhatsApp messages using tenant-scoped provider credentials.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: send-whatsapp-messages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - WhatsappOutboundQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - MessagingControlTable
                      - Arn
                  - Fn::GetAtt:
                      - MessagingDataTable
                      - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-whatsappSender:*
