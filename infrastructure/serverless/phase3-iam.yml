Resources:
  TelegramWebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-telegram-webhook-${sls:stage}
      Description:
        Resolves Telegram webhook registrations, verifies their secret, and enqueues updates.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: receive-telegram-webhooks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - MessagingControlTable
                    - Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - InboundQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-telegramWebhook:*

  InboundProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-inbound-processor-${sls:stage}
      Description: Consumes verified provider updates and atomically persists normalized messages.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: process-inbound-messages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - InboundQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - MessagingControlTable
                      - Arn
                  - Fn::GetAtt:
                      - MessagingDataTable
                      - Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-inboundProcessor:*

  TelegramSenderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-telegram-sender-${sls:stage}
      Description: Sends queued Telegram messages using tenant-scoped provider credentials.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: send-telegram-messages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - TelegramOutboundQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - MessagingControlTable
                      - Arn
                  - Fn::GetAtt:
                      - MessagingDataTable
                      - Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-telegramSender:*
