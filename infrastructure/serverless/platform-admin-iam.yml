Resources:
  PlatformAdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-platform-admin-${sls:stage}
      Description: Manages integrations, encrypted OpenAI credentials, and safe data purges.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: administer-messaging-integrations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - MessagingControlTable
                      - Arn
                  - Fn::GetAtt:
                      - MessagingDataTable
                      - Arn
                  - Fn::Sub:
                      - ${TableArn}/index/*
                      - TableArn:
                          Fn::GetAtt:
                            - MessagingControlTable
                            - Arn
              - Effect: Allow
                Action:
                  - kms:Encrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
                Condition:
                  StringEquals:
                    "kms:EncryptionContext:stage": ${sls:stage}
                    "kms:EncryptionContext:resourceType": OPENAI_CREDENTIAL
                    "kms:EncryptionContext:tableName":
                      Ref: MessagingControlTable
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-platformAdmin:*
