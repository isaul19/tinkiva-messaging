Resources:
  ProviderCredentialsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description:
        Encrypts tenant-scoped provider and integration-scoped OpenAI credentials in DynamoDB.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: "*"
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      Tags:
        - Key: DataClassification
          Value: restricted

  ProviderCredentialsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tinkiva-messaging-provider-credentials-${sls:stage}
      TargetKeyId:
        Ref: ProviderCredentialsKey

  TenantSecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tinkiva-${sls:stage}-secrets
      TargetKeyId:
        Ref: ProviderCredentialsKey
