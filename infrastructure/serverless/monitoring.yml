Resources:
  MessagingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tinkiva-messaging-alarms-${sls:stage}
      DisplayName: Tinkiva messaging alarms
      KmsMasterKeyId: alias/aws/sns

  InboundDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tinkiva-messaging-inbound-dlq-${sls:stage}
      AlarmDescription: At least one inbound event is waiting in the DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - InboundDlq
              - QueueName
      AlarmActions:
        - Ref: MessagingAlarmTopic

