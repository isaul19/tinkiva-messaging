Resources:
  AuthTokenLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-auth-token-${sls:stage}
      Description: Reads application credentials and signing material to issue access tokens.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: issue-application-tokens
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - MessagingControlTable
                    - Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Ref: AuthPepperSecret
                  - Ref: JwtSigningSecret
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-authToken:*

  ApiAuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-authorizer-${sls:stage}
      Description: Validates JWTs against the current application and client state.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: authorize-application-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - MessagingControlTable
                    - Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Ref: JwtSigningSecret
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-apiAuthorizer:*

  PrivateApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tinkiva-messaging-private-api-${sls:stage}
      Description: Manages application-scoped tenants, integrations, and outbound messages.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: manage-application-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - MessagingControlTable
                      - Arn
                  - Fn::GetAtt:
                      - MessagingDataTable
                      - Arn
                  - Fn::Sub:
                      - ${TableArn}/index/*
                      - TableArn:
                          Fn::GetAtt:
                            - MessagingControlTable
                            - Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - Fn::GetAtt:
                      - TelegramOutboundQueue
                      - Arn
                  - Fn::GetAtt:
                      - WhatsappOutboundQueue
                      - Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                Resource:
                  Fn::GetAtt:
                    - ProviderCredentialsKey
                    - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: ${MessagingMediaBucket.Arn}/tenants/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-privateApi:*
