Outputs:
  ControlTableName:
    Description: DynamoDB control-plane table.
    Value:
      Ref: MessagingControlTable
  DataTableName:
    Description: DynamoDB message-data table.
    Value:
      Ref: MessagingDataTable
  MediaBucketName:
    Description: Private S3 media and raw-event bucket.
    Value:
      Ref: MessagingMediaBucket
  InboundQueueUrl:
    Description: FIFO queue for normalized inbound provider events.
    Value:
      Ref: InboundQueue
  InboundQueueArn:
    Description: ARN of the inbound FIFO queue.
    Value:
      Fn::GetAtt:
        - InboundQueue
        - Arn
  WhatsappOutboundQueueUrl:
    Description: FIFO queue for WhatsApp outbound commands.
    Value:
      Ref: WhatsappOutboundQueue
  TelegramOutboundQueueUrl:
    Description: FIFO queue for Telegram outbound commands.
    Value:
      Ref: TelegramOutboundQueue
  AppEventsQueueUrl:
    Description: FIFO queue for application delivery events.
    Value:
      Ref: AppEventsQueue
  StoragiaAutomationQueueUrl:
    Description: FIFO queue for StoragIA inbound-message automation events.
    Value:
      Ref: StoragiaAutomationQueue
  StoragiaAutomationQueueArn:
    Description: ARN of the StoragIA automation FIFO queue.
    Value:
      Fn::GetAtt:
        - StoragiaAutomationQueue
        - Arn
  StoragiaAutomationDlqUrl:
    Description: Dead-letter queue for StoragIA automation events.
    Value:
      Ref: StoragiaAutomationDlq
  StoragiaAutomationDlqArn:
    Description: ARN of the StoragIA automation dead-letter queue.
    Value:
      Fn::GetAtt:
        - StoragiaAutomationDlq
        - Arn
  RealtimeWebsocketUrl:
    Description: Tenant-scoped realtime WebSocket endpoint.
    Value:
      Fn::Join:
        - ""
        - - "wss://"
          - Ref: WebsocketsApi
          - ".execute-api."
          - Ref: AWS::Region
          - ".amazonaws.com/${sls:stage}"
  MediaQueueUrl:
    Description: Standard queue for asynchronous media processing.
    Value:
      Ref: MediaQueue
  ProviderCredentialsKeyArn:
    Description: KMS key encrypting provider and per-integration OpenAI credentials in DynamoDB.
    Value:
      Fn::GetAtt:
        - ProviderCredentialsKey
        - Arn
  TenantIntegrationsTableName:
    Description: Single source of encrypted tenant provider credentials.
    Value:
      Ref: TinkivaTenantIntegrations
  TenantSecretsKeyArn:
    Description: KMS key used for application-level tenant credential encryption.
    Value:
      Fn::GetAtt:
        - ProviderCredentialsKey
        - Arn
  AuthPepperSecretArn:
    Description: ARN of the generated application authentication pepper.
    Value:
      Ref: AuthPepperSecret
  JwtSigningSecretArn:
    Description: ARN of the generated JWT signing secret.
    Value:
      Ref: JwtSigningSecret
  AlarmTopicArn:
    Description: SNS topic receiving messaging infrastructure alarms.
    Value:
      Ref: MessagingAlarmTopic
